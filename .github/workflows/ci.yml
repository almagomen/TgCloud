name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  verify:
    name: 1. Verify UV Lockfile & Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check uv.lock consistency
        run: uv lock --check

      - name: Verify dependencies sync (--frozen)
        run: uv sync --frozen

      - name: Verify Python syntax
        run: uv run python -m compileall src/ auth/

  deploy:
    name: 2. Auto Deploy to Oracle VPS
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/projects/TgCloud
            git pull origin main
            ~/.local/bin/uv sync --frozen
            sudo systemctl restart tgcloud.service
