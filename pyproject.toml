[project]
name = "tgcloud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "almagomen", email = "almagomen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fasttelethonhelper>=1.0.7",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "python-dotenv>=1.2.3",
    "telethon>=1.44.0",
    "tgcrypto>=1.2.5",
]

[project.scripts]
tgcloud = "tgcloud:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
